server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Block access to infrastructure / config files
    location ~* \.(yml|yaml|conf|env|md)$ {
        deny all;
        return 404;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript text/html text/plain;

    # No caching — always serve fresh files
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
